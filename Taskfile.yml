version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  build:
    desc: Build the Lambda deployment package (dist/lambda.zip) with GoReleaser
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist

  format:
    desc: Run gofmt on all Go source files
    cmds:
      - go fmt ./...
      - terraform fmt --recursive

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
