version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  build:
    desc: Build the Lambda deployment package to dist/ (uses GoReleaser)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist

  format:
    desc: Run gofmt (or go fmt) on all Go source files and terraform fmt on all Terraform files
    cmds:
      - gofmt -w -l . || go fmt ./...
      - terraform fmt --recursive

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
