version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  build:
    desc: Build the Lambda deployment package (dist/lambda.zip)
    cmds:
      - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/bootstrap ./cmd/lambda
      - cp LICENSE.md dist/LICENSE.md
      - cd dist && zip -q -X lambda.zip bootstrap LICENSE.md
      - rm dist/bootstrap dist/LICENSE.md

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
