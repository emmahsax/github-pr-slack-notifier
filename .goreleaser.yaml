version: 2
project_name: github-pr-slack-notifier

archives:
  - files:
      - LICENSE.md
    formats:
      - zip
    ids:
      - lambda
    name_template: lambda     # Produces lambda.zip, which the Terraform module downloads
    wrap_in_directory: false  # Bootstrap file must be at the zip root

builds:
  - binary: bootstrap
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - arm64
    goos:
      - linux
    id: lambda
    ldflags:
      - -s -w
    main: ./cmd/lambda
    mod_timestamp: "{{ .CommitTimestamp }}"

changelog:
  use: github-native

checksum:
  name_template: checksums.txt
