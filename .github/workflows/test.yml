name: Test

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:

jobs:
  setup:
    if: ${{ !github.event.pull_request.draft }}
    outputs:
      branch: ${{ steps.set_branch_variable.outputs.branch }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - id: set_branch_variable
        name: Set Branch Variable
        uses: emmahsax/github-actions/set-branch-variable@main

  go-test:
    needs: [ setup ]
    permissions:
      contents: read
    uses: emmahsax/github-actions/.github/workflows/go-test.yml@main
    with:
      branch: ${{ needs.setup.outputs.branch }}
      build_command: task build
      go_version: 1.26

  terraform-validate:
    needs: [ setup ]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        working_directory: [terraform/module, terraform/testing]
    uses: emmahsax/github-actions/.github/workflows/terraform-validate.yml@main
    with:
      branch: ${{ needs.setup.outputs.branch }}
      terraform_version: ~1.15.8
      working_directory: ${{ matrix.working_directory }}
